<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NoteWise Auth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: { ink: "#20243a", violet: "#4f46b5", canvas: "#f7f7fb" },
            fontFamily: { sans: ["Be Vietnam Pro", "sans-serif"] },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body
    class="grid min-h-screen place-items-center bg-canvas p-5 font-sans text-ink"
  >
    <main
      class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-8 shadow-xl"
    >
      <div class="mb-8 flex items-center gap-3 font-bold">
        <span
          class="grid h-10 w-10 place-items-center rounded-xl bg-violet text-white"
          >N</span
        >NoteWise
      </div>
      <p class="text-xs font-bold uppercase tracking-widest text-violet">
        Không gian học tập cá nhân
      </p>
      <h1 class="mt-2 text-2xl font-bold">Chào mừng trở lại</h1>
      <p class="mt-2 text-sm text-slate-500">
        Đăng nhập để tiếp tục tiến độ học của bạn.
      </p>
      <div class="mt-7 grid grid-cols-2 gap-1 rounded-lg bg-slate-100 p-1">
        <button
          class="rounded-md bg-white py-2 text-sm font-semibold text-violet shadow"
        >
          Đăng nhập</button
        ><button class="py-2 text-sm text-slate-500">Đăng ký</button>
      </div>
      <form class="mt-6 space-y-4">
        <label class="block text-sm font-semibold"
          >Email<input
            class="mt-2 w-full rounded-lg border border-slate-200 px-3 py-3 text-sm outline-violet"
            type="email"
            placeholder="ban@example.com"
          /><span class="mt-1 block text-xs text-rose-600"
            >Email chưa hợp lệ. Vui lòng kiểm tra lại.</span
          ></label
        ><label class="block text-sm font-semibold"
          >Mật khẩu
          <div class="mt-2 flex rounded-lg border border-slate-200">
            <input
              class="w-full border-0 px-3 py-3 text-sm outline-none"
              type="password"
              placeholder="••••••••"
            /><button class="px-3 text-xs font-bold text-violet" type="button">
              Hiện
            </button>
          </div></label
        ><button
          class="w-full rounded-lg bg-violet py-3 text-sm font-bold text-white"
        >
          Đăng nhập
        </button>
      </form>
      <p class="mt-5 text-center text-xs text-slate-500">
        ⌾ Chưa đăng nhập sẽ không thể truy cập tài liệu riêng tư.
      </p>
    </main>
  </body>
</html>
